[pytest]
# Where a bare ``pytest`` looks. Every invocation in this project is already
# ``pytest tests/``; stating it here makes that the default rather than a thing
# you have to remember.
#
# Without it, a bare ``pytest`` walks the whole tree, and since 2026-10-22 that
# includes ``_local_archive/`` -- the untracked, local-only mirror of files the
# cleanup removed (see the note in ``.gitignore``). It holds 15 ``test_*.py``
# files for code that no longer exists, so collecting them would produce a
# screenful of failures that look like real breakage and are not.
testpaths = tests

# Belt and braces: ``testpaths`` only applies when no path is given, so an
# explicit ``pytest .`` would still descend into the archive. These directories
# are never test roots.
norecursedirs = _local_archive _archive results docs .* build dist *.egg node_modules
